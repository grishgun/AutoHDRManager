name: Windows portable
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          architecture: x64
      - name: Restore
        run: |
          . ./scripts/environment.ps1
          & $Dotnet restore AutoHDRManager.sln -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
      - name: Build
        run: |
          . ./scripts/environment.ps1
          & $Dotnet build AutoHDRManager.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Test and publish single-file executable
        run: ./scripts/build-release.ps1 -Headless
      - name: Verify output and SHA-256
        run: |
          $files = @(Get-ChildItem dist -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'AutoHDRManager.exe') { throw 'Unexpected output' }
          $hash = (Get-FileHash dist/AutoHDRManager.exe -Algorithm SHA256).Hash
          "$hash  AutoHDRManager.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AutoHDRManager-win-x64
          path: |
            dist/AutoHDRManager.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results
          path: artifacts/tests/*.trx
          if-no-files-found: warn

  portable:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AutoHDRManager-win-x64
          path: dist
      - name: Verify downloaded executable checksum
        run: |
          $expected = ((Get-Content dist/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash dist/AutoHDRManager.exe).Hash -ne $expected) { throw 'Checksum mismatch' }
      - name: Validate portable without installed SDK on a fresh runner
        run: ./scripts/test-portable-without-sdk.ps1
